services:
  servercore:
    build:
      context: .
      dockerfile: Server/Server.Core/Dockerfile
    container_name: servercore
    environment:
      - OUTSIDE_PORT=8080
    ports:
      - "${OUTSIDE_PORT}:5000"
    restart: unless-stopped
    networks:
      - server-network
  #db:
    #restart: unless-stopped
    #networks:
    #  - server-network

networks:
  server-network:
    driver: bridge