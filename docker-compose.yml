services:
  servercore:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servercore
    environment:
      - OUTSIDE_PORT=8080
    ports:
      - "8080:5000" #TODO: Add env variable for port
    restart: unless-stopped
    networks:
      - server-network
  db:
    image: postgres:15
    container_name: serverdb
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpassword
      - POSTGRES_DB=serverdb
    restart: unless-stopped
    networks:
      - server-network

networks:
  server-network:
    driver: bridge